name: CI

on:
  pull_request:
  push:
    branches:
      - claude/sales-forecast-system-design-o6y693
      - codex/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: make test
