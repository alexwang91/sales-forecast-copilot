[project]
name = "sales-forecast-copilot"
version = "0.1.0"
description = "Sales Forecast Decision Copilot implementation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
